<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>
*{box-sizing:border-box}html{scroll-padding-top:28px}body{margin:0;background:#f8f9f7;color:#202620;font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}a{color:#24633c;text-underline-offset:3px}a:hover{color:#143c23}.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:190px minmax(0,1fr);gap:48px;padding:40px 30px 70px}nav{position:sticky;top:34px;align-self:start}nav strong{display:block;font-size:15px;margin-bottom:18px}nav a{display:block;color:#556155;text-decoration:none;padding:7px 0}main{min-width:0}header{padding-bottom:26px;border-bottom:1px solid #dce2da}h1{font-size:30px;line-height:1.45;letter-spacing:-.6px;margin:0 0 12px;font-weight:650}h2{font-size:20px;font-weight:650;margin:38px 0 16px}h3{font-size:16px;margin:22px 0 12px}p{margin:10px 0}.meta,.muted{color:#657064}.eyebrow{font-size:12px;letter-spacing:1px;color:#657064;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid #dce2da;padding:20px 0;gap:16px}.stats strong{display:block;font-size:24px;line-height:1.5;font-weight:600}.stats span{font-size:12px;color:#657064}.notice{border-left:3px solid #33754a;background:#edf3ec;padding:14px 18px;margin:18px 0}.red{color:#aa2929;font-weight:600}.tag{display:inline-block;padding:2px 8px;border:1px solid #d5dfd2;font-size:12px;border-radius:4px;color:#486446}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}th,td{border-bottom:1px solid #dce2da;padding:10px 12px 10px 0;text-align:left;vertical-align:top}th{font-size:12px;color:#657064;font-weight:600}th:first-child{min-width:90px}ul,ol{padding-left:21px}li{margin:7px 0}details{border-top:1px solid #dce2da;padding:14px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f2ee;padding:16px;font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}footer{margin-top:38px;padding-top:18px;border-top:1px solid #dce2da;font-size:13px;color:#657064}.calendar-scroll{overflow-x:auto;padding:8px 0 12px}.calendar-months{display:grid;grid-auto-columns:14px;grid-auto-flow:column;height:22px;width:max-content;margin-left:30px}.calendar-months span{font-size:11px;white-space:nowrap;grid-row:1;color:#657064}.calendar-body{display:flex;gap:8px;width:max-content}.weekdays{display:grid;grid-template-rows:repeat(7,11px);gap:3px;width:22px;font-size:10px;line-height:11px;color:#657064}.calendar{display:grid;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;grid-auto-flow:column;gap:3px;width:max-content}.day{appearance:none;width:11px;height:11px;border:1px solid #d9e1d7;border-radius:2px;background:#e9eee7;padding:0;cursor:pointer}.day:focus-visible{outline:2px solid #202620;outline-offset:2px}.day.l1{background:#b4df9b;border-color:#a3ce8d}.day.l2{background:#72bc70;border-color:#66ab65}.day.l3{background:#3c8e51;border-color:#357f48}.day.l4{background:#21613a;border-color:#1b5332}.day.unknown{background:#fff;border:2px solid #879283}.day.future{background:transparent;border-color:#e8ece5}.legend{display:flex;align-items:center;gap:7px;font-size:12px;color:#657064;flex-wrap:wrap}.sample{width:11px;height:11px;display:inline-block;border:1px solid #d9e1d7;border-radius:2px;background:#e9eee7}.sample.known{background:#3c8e51;border-color:#357f48}.sample.unknown{background:#fff;border:2px solid #879283}.day-detail{min-height:30px;font-size:13px;margin:12px 0}.records{list-style:none;padding:0}.records li{display:flex;gap:20px;border-bottom:1px solid #e3e7e0;padding:10px 0;margin:0}.records time{font-variant-numeric:tabular-nums;white-space:nowrap;color:#657064}.record-note{display:block;font-size:12px;color:#657064}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:26px}.two-col h2{margin-top:28px}.checklist{padding-left:20px}.small{font-size:13px}button{font:inherit}
@media(max-width:850px){.layout{display:block;padding:22px 18px 40px}nav{position:static;border-bottom:1px solid #dce2da;padding-bottom:14px;margin-bottom:26px}nav strong{margin-bottom:8px}nav a{display:inline-block;margin-right:15px;padding:3px 0;font-size:13px}h1{font-size:25px}.stats{grid-template-columns:repeat(2,1fr)}.two-col{display:block}.records li{gap:12px}th,td{padding-right:12px}}
@media print{body{background:white;color:#111}.layout{display:block;padding:0;max-width:none}nav,.calendar-scroll,.legend,.day-detail{display:none}h2,h3{break-after:avoid}tr,.notice{break-inside:avoid}.stats strong{font-size:18px}details{display:block}details>*{display:block}a{color:#111}pre{background:white;border:1px solid #ddd}}
</style></head><body><div class="layout"><nav aria-label="阅读目录"><strong>学习手册</strong>__NAV__</nav><main><header><p class="eyebrow">__EYEBROW__</p><h1>__TITLE__</h1><p class="meta">__SUBTITLE__</p></header>__CONTENT__<footer>__FOOTER__</footer></main></div><script>
document.querySelectorAll('.day').forEach(function(button){function show(){var box=document.getElementById('day-detail');if(!box)return;box.replaceChildren();var text=document.createElement('span');text.textContent=button.dataset.text;box.appendChild(text);if(button.dataset.link){var link=document.createElement('a');link.href=button.dataset.link;link.textContent=' 查看记录';box.appendChild(link)}}button.addEventListener('click',show);button.addEventListener('focus',show)});
document.querySelectorAll('.calendar-scroll').forEach(function(box){var latest=box.querySelector('[data-latest="true"]');if(latest)box.scrollLeft=Math.max(0,latest.offsetLeft-box.offsetLeft-box.clientWidth/2)});
</script></body></html>
